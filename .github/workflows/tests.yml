name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS matters here: /tmp is a symlink there, which the upload sandbox
    # has to resolve.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check --select E9,F src tests
      - run: pytest
